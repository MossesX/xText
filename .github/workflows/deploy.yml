name: Build and deploy to Hostinger VPS

on:
  push:
    branches: [main, ccr-97285d6a-njn2z3]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mossesx/xtext
  SITE_DOMAIN: xgallery.amberxai.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Required repository secrets:
    #   VPS_HOST      public IP or hostname of the Hostinger VPS
    #   VPS_USER      SSH user (usually root)
    #   VPS_SSH_KEY   private key whose public half is in the VPS authorized_keys
    #   GHCR_PULL_TOKEN  a GitHub PAT with read:packages, used by the VPS to pull the private image
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,deploy/Caddyfile"
          target: /opt/xgallery
      - name: Pull and restart the stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/xgallery
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export SITE_DOMAIN="${{ env.SITE_DOMAIN }}"
            docker compose pull app
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
